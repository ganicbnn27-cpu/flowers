<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puantilizm Çiçek Simülasyonu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #050507;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(180, 100, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    .hud-header {
      position: absolute;
      top: 14px;
      left: 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .stage-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      color: #caa0ff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .author-credit {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .author-credit span {
      color: rgba(220, 180, 255, 0.85);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <div class="hud-header">
      <div class="hud-title">Çiçek Yaşam Döngüsü</div>
      <div class="stage-badge" id="stage-badge">Filizlenme</div>
    </div>
    
    <div class="author-credit">
      Developed & Coded by <span>Gani Çoban</span>
    </div>

    <canvas id="cv"></canvas>
  </div>

  <script>
    (function () {
      const SEED = 5;
      const TIME_SCALE = 1.0;
      const KEYS = [
        [0.0, 0.00, 0.00, 0.00, 0.0, 0.00, 0.00],
        [5.0, 0.42, 0.22, 0.00, 0.0, 0.25, 0.00],
        [10.0, 0.62, 0.42, 0.00, 0.0, 0.50, 0.35],
        [16.0, 0.80, 0.68, 0.50, 0.0, 0.72, 0.55],
        [24.0, 1.00, 1.00, 1.00, 0.0, 1.00, 1.00],
        [30.0, 1.00, 1.00, 1.00, 0.0, 1.00, 1.00],
        [39.0, 0.98, 0.85, 0.55, 1.0, 0.92, 0.00],
        [45.0, 0.98, 0.85, 0.55, 1.0, 0.90, 0.00],
      ];
      const T_END = KEYS[KEYS.length - 1][0];

      const SOIL_PAL = [[34,25,20], [50,36,28], [68,50,37], [88,65,47], [108,82,60], [64,58,52]];
      const STEM_PAL = [[62,38,120], [100,58,165], [140,84,200], [60,160,140]];
      const STEM_WILT = [[120,88,66], [96,66,52], [140,108,76]];
      const LEAF_PAL = [[60,150,140], [80,120,175], [130,80,195], [175,105,215]];
      const LEAF_WILT = [[130,100,70], [104,76,58], [146,116,84]];
      const RIB_PAL = [[210,180,255], [170,230,220]];
      const WILT_PAL = [[150,86,128], [116,64,108], [88,52,88], [126,94,104], [104,72,56]];
      const RIM_PAL = [[205,165,255], [255,190,250], [170,140,255]];
      const HI_PAL = [[235,215,255], [255,225,250]];
      const GOLD_PAL = [[255,214,110], [255,238,170], [255,184,90]];
      const STAMEN_PAL = [[255,240,255], [255,215,235], [255,230,150], [255,190,80]];
      const STAMEN_WILT = [[140,112,84], [120,96,72]];

      const LAYERS = [
        { n:8, ac:0.60, ao:1.00, kc:-1.20, ko:0.45, L:1.00, wc:0.20, wo:0.34, d:1100, off:0.00,
          pal:[[210,80,225], [170,58,225], [128,50,218], [96,44,205], [78,42,185]] },
        { n:6, ac:0.48, ao:0.68, kc:-1.05, ko:0.15, L:0.88, wc:0.19, wo:0.31, d:900, off:0.40,
          pal:[[255,150,235], [245,92,218], [205,62,218], [150,52,222]] },
        { n:5, ac:0.36, ao:0.46, kc:-0.85, ko:-0.05, L:0.72, wc:0.17, wo:0.27, d:700, off:0.20,
          pal:[[255,205,245], [255,135,232], [238,84,216], [195,62,226]] },
        { n:4, ac:0.22, ao:0.32, kc:-0.50, ko:-0.10, L:0.46, wc:0.14, wo:0.22, d:450, off:0.55,
          pal:[[255,238,252], [255,185,242], [255,125,228]] },
      ];

      const LEAF_DEFS = [
        [0.10,  1, 1.00, 0.55, -0.80],
        [0.16, -1, 0.90, 0.50, -0.85],
        [0.40,  1, 0.70, 0.95, -0.70],
        [0.33, -1, 0.62, 0.90, -0.65],
      ];

      class Mulberry32 {
        constructor(seed) { this.s = seed >>> 0; }
        next() {
          let t = (this.s += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        normal(mean = 0, std = 1) {
          let u = 0, v = 0;
          while (u === 0) u = this.next();
          while (v === 0) v = this.next();
          return mean + std * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }
        choice(arr, p) {
          const r = this.next();
          let acc = 0;
          for (let i = 0; i < arr.length; i++) {
            acc += p[i];
            if (r <= acc) return arr[i];
          }
          return arr[arr.length - 1];
        }
      }

      function profile(u) {
        const cu = Math.max(0, Math.min(1, u));
        return Math.pow(Math.sin(Math.PI * Math.pow(cu, 0.75)), 0.85);
      }

      function sinc(x) {
        if (Math.abs(x) < 1e-6) return 1.0;
        return Math.sin(x) / x;
      }

      function smoothstep(x, a, b) {
        const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }

      function palettePick(rng, pal, g, spread = 0.55, jitter = 0.07) {
        const x = Math.max(0, Math.min(1, g)) * (pal.length - 1) + rng.normal(0, spread);
        const idx = Math.max(0, Math.min(pal.length - 1, Math.round(x)));
        const j = 1 + rng.normal(0, jitter);
        return [pal[idx][0] * j, pal[idx][1] * j, pal[idx][2] * j];
      }

      function areaU(rng, n) {
        const res = new Float32Array(n);
        let filled = 0;
        while (filled < n) {
          const u = rng.next();
          if (rng.next() < profile(u)) {
            res[filled++] = u;
          }
        }
        return res;
      }

      function sampleV(rng, n, rim = 0.14) {
        const res = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          let v = rng.next() * 2 - 1;
          if (rng.next() < rim) {
            v = Math.sign(v) * (0.88 + rng.next() * 0.12);
          }
          res[i] = v;
        }
        return res;
      }

      function getState(t) {
        t = Math.max(0.0, Math.min(t, T_END));
        let i = 0;
        for (let k = 0; k < KEYS.length - 1; k++) {
          if (t >= KEYS[k][0]) i = k;
        }
        i = Math.min(i, KEYS.length - 2);

        const u = (t - KEYS[i][0]) / (KEYS[i + 1][0] - KEYS[i][0]);
        const p0 = KEYS[Math.max(i - 1, 0)];
        const p1 = KEYS[i];
        const p2 = KEYS[i + 1];
        const p3 = KEYS[Math.min(i + 2, KEYS.length - 1)];

        const v = [];
        for (let j = 1; j < 7; j++) {
          const val = 0.5 * (
            2 * p1[j] +
            (p2[j] - p0[j]) * u +
            (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u * u +
            (3 * p1[j] - p0[j] - 3 * p2[j] + p3[j]) * u * u * u
          );
          v.push(Math.max(0, Math.min(1, val)));
        }
        return v;
      }

      function bez(P, s) {
        const q = 1 - s;
        const x = q*q*q * P[0][0] + 3*q*q*s * P[1][0] + 3*q*s*s * P[2][0] + s*s*s * P[3][0];
        const y = q*q*q * P[0][1] + 3*q*q*s * P[1][1] + 3*q*s*s * P[2][1] + s*s*s * P[3][1];
        const dx = 3*q*q*(P[1][0] - P[0][0]) + 6*q*s*(P[2][0] - P[1][0]) + 3*s*s*(P[3][0] - P[2][0]);
        const dy = 3*q*q*(P[1][1] - P[0][1]) + 6*q*s*(P[2][1] - P[1][1]) + 3*s*s*(P[3][1] - P[2][1]);
        return [x, y, dx, dy];
      }

      function mixCol(lR, lG, lB, wR, wG, wB, w) {
        return [
          lR + (wR - lR) * w,
          lG + (wG - lG) * w,
          lB + (wB - lB) * w
        ];
      }

      class Plant {
        constructor(w, h) {
          this.W = w;
          this.H = h;
          this.rng = new Mulberry32(SEED);
          this.cx = w / 2;
          this.y0 = h * 0.80;
          this.Ls = h * 0.38;
          this.Lf = h * 0.235;

          this.initSoil();
          this.initStem();
          this.initLeaves();
          this.initHead();
          this.initStamens();
          this.initFx();
        }

        surface(x) {
          const H = this.H;
          const dx = (x - this.cx) / (0.2 * this.W);
          return (this.y0 - 0.022 * H * Math.exp(-dx * dx)
                 - 0.003 * H * Math.sin(x * 0.045)
                 - 0.002 * H * Math.sin(x * 0.13 + 1.3));
        }

        initSoil() {
          const { W, H, rng } = this;
          const n = 22000;
          this.soilPoints = [];
          for (let i = 0; i < n; i++) {
            const x = rng.next() * W;
            const d = Math.pow(rng.next(), 1.5) * 0.14 * H;
            const y = this.surface(x) + d;
            const depth = d / (0.14 * H);
            const edge = Math.pow(Math.min(1, Math.min(x, W - x) / (0.2 * W)), 0.8);
            const clump = 0.5 + 0.5 * Math.sin(x * 0.07 + y * 0.05) * Math.sin(y * 0.11 - x * 0.03);
            const bright = Math.pow(1 - depth, 0.8) * edge * (0.55 + 0.35 * clump + 0.35 * rng.next());
            const c = palettePick(rng, SOIL_PAL, rng.next(), 1.0);
            const rad = rng.choice([1.0, 1.4, 1.9], [0.4, 0.4, 0.2]);
            this.soilPoints.push({
              x, y,
              r: Math.min(255, Math.max(0, c[0] * bright)),
              g: Math.min(255, Math.max(0, c[1] * bright)),
              b: Math.min(255, Math.max(0, c[2] * bright)),
              rad
            });
          }

          const k = 150;
          this.pebbles = [];
          for (let i = 0; i < k; i++) {
            const px = 0.05 * W + rng.next() * 0.90 * W;
            const py = this.surface(px) + Math.pow(rng.next(), 1.3) * 0.1 * H;
            const edge = Math.pow(Math.min(1, Math.min(px, W - px) / (0.2 * W)), 0.8);
            const pc = palettePick(rng, [[58,52,48], [84,74,64], [104,90,76], [46,38,32]], rng.next(), 0.7);
            const rad = rng.choice([2.0, 2.8], [0.6, 0.4]);
            this.pebbles.push({
              x: px, y: py,
              r: Math.min(255, Math.max(0, pc[0] * edge)),
              g: Math.min(255, Math.max(0, pc[1] * edge)),
              b: Math.min(255, Math.max(0, pc[2] * edge)),
              rad
            });
          }

          const m = 480;
          this.crust = [];
          for (let i = 0; i < m; i++) {
            const cx = this.cx + rng.normal(0, 0.03 * H);
            const c = palettePick(rng, SOIL_PAL, 0.3 + rng.next() * 0.7, 0.8);
            this.crust.push({
              x: cx,
              y: this.surface(cx) - rng.next() * 0.006 * H,
              amp: H * 0.05 * Math.pow(rng.next(), 2.2),
              delay: rng.next() * 2.5,
              r: c[0] * 0.8, g: c[1] * 0.8, b: c[2] * 0.8,
              rad: rng.choice([1.0, 1.4, 1.9], [0.4, 0.4, 0.2])
            });
          }
        }

        initStem() {
          const { rng } = this;
          const n = 3400;
          this.stem = [];
          for (let i = 0; i < n; i++) {
            const s = rng.next();
            let lat = rng.next() * 2 - 1;
            if (rng.next() < 0.18) {
              lat = Math.sign(lat) * (0.85 + rng.next() * 0.15);
            }
            let live = palettePick(rng, STEM_PAL.slice(0, 3), s * 0.8 + rng.next() * 0.2);
            if (rng.next() < 0.12) {
              const gr = STEM_PAL[3];
              const j = 1 + rng.normal(0, 0.08);
              live = [gr[0] * j, gr[1] * j, gr[2] * j];
            }
            const wilt = palettePick(rng, STEM_WILT, rng.next(), 0.8);
            this.stem.push({
              s, lat, live, wilt,
              rn: rng.next(),
              rad: rng.choice([1.0, 1.4, 1.9], [0.35, 0.45, 0.2])
            });
          }
        }

        initLeaves() {
          const { rng } = this;
          const d = 800;
          this.leaves = [];
          for (let j = 0; j < LEAF_DEFS.length; j++) {
            const uArr = areaU(rng, d);
            const vArr = sampleV(rng, d, 0.10);
            for (let i = 0; i < d; i++) {
              let u = uArr[i];
              let v = vArr[i];
              let isRib = rng.next() < 0.09;
              if (isRib) v = rng.normal(0, 0.03);

              let live = isRib
                ? palettePick(rng, RIB_PAL, rng.next())
                : palettePick(rng, LEAF_PAL, u + rng.normal(0, 0.1));

              const wilt = palettePick(rng, LEAF_WILT, rng.next(), 0.8);
              this.leaves.push({
                lid: j, u, v, live, wilt,
                rn: rng.next(),
                rad: rng.choice([1.0, 1.4, 1.9], [0.35, 0.45, 0.2])
              });
            }
          }
        }

        initHead() {
          const { rng } = this;
          this.head = [];
          for (let ly of LAYERS) {
            const d = ly.d;
            for (let i = 0; i < ly.n; i++) {
              const th = (2 * Math.PI * i) / ly.n + ly.off + rng.normal(0, 0.10);
              const aj = rng.normal(0, 0.06);
              const lj = 0.92 + rng.next() * 0.16;
              const pj = rng.next();
              const wj = -0.5 + rng.next();
              const uArr = areaU(rng, d);
              const vArr = sampleV(rng, d, 0.14);

              for (let k = 0; k < d; k++) {
                const u = uArr[k];
                const v = vArr[k];
                let col = palettePick(rng, ly.pal, u + rng.normal(0, 0.10));

                if (Math.abs(v) > 0.86 && rng.next() < 0.55) {
                  col = palettePick(rng, RIM_PAL, rng.next());
                } else if (rng.next() < 0.04) {
                  col = palettePick(rng, HI_PAL, rng.next());
                } else if (u < 0.55 && rng.next() < 0.02) {
                  col = palettePick(rng, GOLD_PAL, rng.next());
                }

                const wilt = palettePick(rng, WILT_PAL, 0.4 * u + 0.6 * rng.next(), 0.7);
                this.head.push({
                  th, aj, pj, wj, u, v,
                  ac: ly.ac, ao: ly.ao, kc: ly.kc, ko: ly.ko,
                  L: ly.L * lj, wc: ly.wc, wo: ly.wo,
                  sp: profile(u),
                  live: col, wilt,
                  rn: rng.next(),
                  rad: rng.choice([1.0, 1.4, 1.9], [0.3, 0.45, 0.25])
                });
              }
            }
          }
        }

        initStamens() {
          const { rng } = this;
          const n = 650, nf = 60;
          const flTh = new Float32Array(nf);
          const flBeta = new Float32Array(nf);
          const flEll = new Float32Array(nf);
          for (let i = 0; i < nf; i++) {
            flTh[i] = rng.next() * 2 * Math.PI;
            flBeta[i] = 0.2 + rng.next() * 0.65;
            flEll[i] = 0.30 + rng.next() * 0.25;
          }

          this.stamens = [];
          for (let i = 0; i < n; i++) {
            const fid = Math.floor(rng.next() * nf);
            const t = 1 - Math.pow(rng.next(), 1.6);
            const live = palettePick(rng, STAMEN_PAL, t, 0.35);
            const wilt = palettePick(rng, STAMEN_WILT, rng.next(), 0.6);
            this.stamens.push({
              th: flTh[fid],
              beta: flBeta[fid],
              ell: flEll[fid],
              t, live, wilt,
              rad: t > 0.88 ? 2.0 : rng.choice([1.0, 1.4], [0.5, 0.5])
            });
          }
        }

        initFx() {
          const { rng, cx, H } = this;
          const nH = 1600;
          this.halo = [];
          for (let i = 0; i < nH; i++) {
            const r = Math.min(Math.abs(rng.normal(0, 0.55)), 1.6);
            this.halo.push({
              a: rng.next() * 2 * Math.PI,
              r,
              b: Math.pow(1 - r / 1.6, 1.5) * 0.55,
              fl: rng.next()
            });
          }

          this.ring = [];
          for (let j = 0; j < 7; j++) {
            const m = j === 0 ? 600 : 150;
            for (let i = 0; i < m; i++) {
              this.ring.push({
                cf: j === 0 ? 0.0 : 0.5,
                cj: Math.max(j - 1, 0),
                rho: j === 0 ? 1.0 : 0.5,
                a: rng.next() * 2 * Math.PI,
                fl: rng.next()
              });
            }
          }

          const mSp = 240;
          this.spark = [];
          for (let i = 0; i < mSp; i++) {
            this.spark.push({
              a: rng.next() * 2 * Math.PI,
              rho: rng.next(),
              ph: rng.next(),
              sp: 0.6 + rng.next() * 0.8,
              rad: rng.choice([1.0, 2.0], [0.7, 0.3]),
              hue: rng.next()
            });
          }

          const mFall = 240;
          this.fall = [];
          for (let i = 0; i < mFall; i++) {
            const xl = cx + rng.normal(0, 0.12 * H);
            this.fall.push({
              r0: rng.next(),
              ox: rng.normal(0, 1),
              oy: rng.normal(0, 1),
              xl,
              yl: this.surface(xl) - rng.next() * 0.012 * H,
              ph: rng.next() * 6.28,
              col: palettePick(rng, WILT_PAL, rng.next(), 0.8),
              rad: rng.choice([1.5, 2.0], [0.5, 0.5])
            });
          }
        }

        getCtrl(L, wilt, sway) {
          const { cx, y0 } = this;
          return [
            [cx, y0 + 4.0],
            [cx - 0.06 * L * (1 - wilt) + 0.02 * L * wilt, y0 - 0.33 * L],
            [cx + 0.05 * L * (1 - wilt) + 0.08 * L * wilt + sway * 0.5, y0 - L * (0.74 + 0.30 * wilt)],
            [cx + sway + 0.32 * L * wilt, y0 - L * (1 - 0.15 * wilt)]
          ];
        }

        render(ctx, t) {
          const { W, H, Ls, Lf } = this;
          const [stem, size, bloom, wilt, leaf, glow] = getState(t);

          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, W, H);

          // Toprak ve Taşlar
          for (let i = 0; i < this.soilPoints.length; i++) {
            const p = this.soilPoints[i];
            ctx.fillStyle = `rgb(${p.r | 0},${p.g | 0},${p.b | 0})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.rad, 0, 6.283);
            ctx.fill();
          }

          for (let i = 0; i < this.pebbles.length; i++) {
            const p = this.pebbles[i];
            ctx.fillStyle = `rgb(${p.r | 0},${p.g | 0},${p.b | 0})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.rad, 0, 6.283);
            ctx.fill();
          }

          const queue = [];
          const L = Ls * stem;
          const sway = 0.012 * H * Math.sin(t * 0.9) * stem * (1 - 0.6 * wilt);
          const P = this.getCtrl(L, wilt, sway);
          const hx = P[3][0], hy = P[3][1];

          // Sap
          if (stem > 0.01) {
            const nv = (this.stem.length * Math.min(1, Math.max(0.08, stem))) | 0;
            for (let i = 0; i < nv; i++) {
              const item = this.stem[i];
              const [x, y, dx, dy] = bez(P, item.s);
              const nn = Math.hypot(dx, dy) + 1e-6;
              const wst = 0.0085 * H * (1 - 0.3 * item.s) * (1 - 0.25 * wilt) * Math.min(1, Math.max(0.4, 0.4 + stem * 1.2));
              const lat = item.lat * wst;
              const wi = Math.max(0, Math.min(1, wilt * (0.75 + 0.5 * item.s) * (0.7 + 0.5 * item.rn)));
              const c = mixCol(item.live[0], item.live[1], item.live[2], item.wilt[0], item.wilt[1], item.wilt[2], wi);
              queue.push({
                x: x - (dy / nn) * lat,
                y: y + (dx / nn) * lat,
                col: c,
                rad: item.rad,
                z: -500.0
              });
            }
          }

          // Yapraklar
          if (leaf > 0.02 && stem > 0.05) {
            const nv = (this.leaves.length * Math.min(1, Math.max(0.15, leaf))) | 0;
            const bezA = LEAF_DEFS.map(d => bez(P, d[0]));
            for (let i = 0; i < nv; i++) {
              const it = this.leaves[i];
              const def = LEAF_DEFS[it.lid];
              const m = def[1];
              const lfac = def[2];
              const a0 = def[3] + (1 - leaf) * 0.8 - 0.6 * wilt;
              const c = def[4] - 0.5 * wilt;
              const LL = 0.19 * H * lfac * leaf * (1 - 0.25 * wilt);
              const am = a0 + c * it.u * 0.5;
              const al = a0 + c * it.u;
              const sc = sinc(c * it.u * 0.5);
              const lat = it.v * 0.27 * LL * profile(it.u);
              const ax = bezA[it.lid][0];
              const ay = bezA[it.lid][1];
              const X = ax + LL * it.u * m * Math.cos(am) * sc - lat * Math.sin(al);
              const Yup = LL * it.u * Math.sin(am) * sc + lat * m * Math.cos(al);
              const wi = Math.max(0, Math.min(1, wilt * (0.9 + 0.5 * it.u + 0.3 * it.rn) - 0.1));
              const col = mixCol(it.live[0], it.live[1], it.live[2], it.wilt[0], it.wilt[1], it.wilt[2], wi);
              queue.push({
                x: X,
                y: ay - Yup,
                col,
                rad: it.rad,
                z: -450.0
              });
            }
          }

          // Çiçek Başı & Taç Yapraklar
          if (stem > 0.01 && size > 0.05) {
            const phi = wilt * 2.75 + 0.035 * Math.sin(t * 0.9 + 1.0) * (1 - wilt);
            const tau = 0.20 + 0.36 * bloom - 0.40 * wilt;
            const cphi = Math.cos(phi), sphi = Math.sin(phi);
            const ct = Math.cos(tau), st_ = Math.sin(tau);
            const Ls_ = Lf * size;

            const project = (xl, yl, zl) => {
              const yp = yl * ct - zl * st_;
              const zp = yl * st_ + zl * ct;
              return [
                hx + xl * cphi + yp * sphi,
                hy - (-xl * sphi + yp * cphi),
                zp,
                yp
              ];
            };

            const vis = Math.min(1.0, Math.max(0.2, size * size * 1.15));
            const nv = (this.head.length * vis) | 0;
            for (let i = 0; i < nv; i++) {
              const it = this.head[i];
              let A0 = it.ac + (it.ao - it.ac) * bloom + it.aj;
              A0 = A0 * (1 - 0.55 * wilt) + wilt * it.wj * 0.3;
              const K = it.kc + (it.ko - it.kc) * bloom + wilt * (0.6 + 0.6 * it.pj);
              const Lp = Ls_ * it.L * (1 - 0.28 * wilt * it.pj);
              const am = A0 + K * it.u * 0.5;
              const sc = sinc(K * it.u * 0.5);
              let rr = Lp * it.u * Math.sin(am) * sc;
              const hh = Lp * it.u * Math.cos(am) * sc;
              const lat = it.v * (it.wc + (it.wo - it.wc) * bloom) * Lp * it.sp;
              rr = rr + 0.025 * Ls_ - (0.5 * lat * lat) / (Lp + 1.0);

              const cth = Math.cos(it.th), sth = Math.sin(it.th);
              const [X, Y, zp, yp] = project(cth * rr - sth * lat, hh, sth * rr + cth * lat);
              const shade = Math.min(1.2, Math.max(0.5, 0.72 + 0.28 * Math.min(1, Math.max(0, (zp / Ls_) * 0.5 + 0.5)) + 0.12 * (hh / Ls_)));
              const wi = Math.max(0, Math.min(1, wilt * (1.0 + 0.7 * it.u + 0.4 * it.rn) - 0.2));
              const c = mixCol(it.live[0], it.live[1], it.live[2], it.wilt[0], it.wilt[1], it.wilt[2], wi);
              queue.push({
                x: X,
                y: Y,
                col: [c[0] * shade, c[1] * shade, c[2] * shade],
                rad: it.rad,
                z: zp
              });
            }

            // Tepecikler (Stamens)
            const ss = smoothstep(bloom, 0.30, 0.85);
            if (ss > 0.02) {
              const nv2 = (this.stamens.length * Math.min(1, Math.max(0.25, size * size))) | 0;
              for (let i = 0; i < nv2; i++) {
                const it = this.stamens[i];
                const ell = Ls_ * ss * it.ell;
                const beta = it.beta * (0.6 + 0.4 * bloom) + wilt * 0.3;
                const r = ell * it.t * Math.sin(beta) + 0.02 * Ls_;
                const yl = 0.05 * Ls_ + ell * it.t * Math.cos(beta);
                const [X, Y, zp] = project(Math.cos(it.th) * r, yl, Math.sin(it.th) * r);
                const col = mixCol(it.live[0], it.live[1], it.live[2], it.wilt[0], it.wilt[1], it.wilt[2], wilt);
                queue.push({
                  x: X,
                  y: Y,
                  col,
                  rad: it.rad,
                  z: zp + 3.0
                });
              }
            }

            // Mistik Glow & Işıltılar
            if (glow > 0.02) {
              const axis = [Math.sin(phi), -Math.cos(phi)];
              const ccx = hx + axis[0] * 0.5 * Ls_;
              const ccy = hy + axis[1] * 0.5 * Ls_;

              const nh = (this.halo.length * glow) | 0;
              for (let i = 0; i < nh; i++) {
                const it = this.halo[i];
                const rh = it.r * Ls_ * 1.1;
                const br = it.b * glow * (0.85 + 0.3 * Math.sin(t * 1.3 + it.fl * 6.28));
                queue.push({
                  x: ccx + Math.cos(it.a) * rh,
                  y: ccy + Math.sin(it.a) * rh,
                  col: [150 * br, 70 * br, 240 * br],
                  rad: 1.0,
                  z: -2000.0
                });
              }

              const nr = (this.ring.length * glow) | 0;
              const Rs = Ls_ * 1.25;
              for (let i = 0; i < nr; i++) {
                const it = this.ring[i];
                const cang = (2 * Math.PI * it.cj) / 6 + t * 0.15;
                const a = it.a + t * 0.05;
                const rx = ccx + Rs * (it.cf * Math.cos(cang) + it.rho * Math.cos(a));
                const ry = ccy + Rs * (it.cf * Math.sin(cang) + it.rho * Math.sin(a));
                const bb = (0.40 + 0.60 * glow) * (0.65 + 0.35 * Math.sin(t * 2 + it.fl * 20));
                queue.push({
                  x: rx,
                  y: ry,
                  col: [210 * bb, 145 * bb, 255 * bb],
                  rad: 1.0,
                  z: -1500.0
                });
              }

              for (let j = 0; j < 6; j++) {
                const ja = (2 * Math.PI * j) / 6 + t * 0.15;
                queue.push({
                  x: ccx + Rs * Math.cos(ja),
                  y: ccy + Rs * Math.sin(ja),
                  col: [255 * glow, 215 * glow, 255 * glow],
                  rad: 3.0,
                  z: 0.0
                });
              }

              for (let i = 0; i < this.spark.length; i++) {
                const it = this.spark[i];
                const life = (t * 0.10 * it.sp + it.ph) % 1.0;
                const rho = (0.25 + 1.15 * it.rho) * Ls_ * (0.6 + 0.6 * life);
                const px = ccx + Math.cos(it.a) * rho;
                const py = ccy + Math.sin(it.a) * rho - life * 0.25 * Ls_;
                const bs = Math.pow(Math.sin(Math.PI * life), 0.8) * glow;
                const baseC = it.hue < 0.5 ? [255, 215, 255] : [255, 150, 235];
                queue.push({
                  x: px,
                  y: py,
                  col: [baseC[0] * bs, baseC[1] * bs, baseC[2] * bs],
                  rad: it.rad,
                  z: 2000.0
                });
              }
            }

            // Dökülen Yapraklar
            if (wilt > 0.02) {
              for (let i = 0; i < this.fall.length; i++) {
                const it = this.fall[i];
                const fp = Math.min(1, Math.max(0, (wilt * 1.05 - it.r0 * 0.7) / 0.35));
                if (fp > 0) {
                  const sx = hx + it.ox * 0.18 * Ls_;
                  const sy = hy + it.oy * 0.18 * Ls_ + 0.25 * Ls_;
                  const fx = sx + (it.xl - sx) * fp + Math.sin(fp * 6.28 + it.ph) * 0.03 * H * (1 - fp);
                  const fy = sy + (it.yl - sy) * fp * fp;
                  queue.push({
                    x: fx,
                    y: fy,
                    col: it.col,
                    rad: it.rad,
                    z: 500.0
                  });
                }
              }
            }
          }

          // Z-Sorting (Derinlik Sıralaması)
          queue.sort((a, b) => a.z - b.z);

          // Çizim
          for (let i = 0; i < queue.length; i++) {
            const p = queue[i];
            const r = Math.min(255, Math.max(0, p.col[0])) | 0;
            const g = Math.min(255, Math.max(0, p.col[1])) | 0;
            const b = Math.min(255, Math.max(0, p.col[2])) | 0;
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.rad, 0, 6.283);
            ctx.fill();
          }

          // Toprak Çatlağı Partikülleri
          for (let i = 0; i < this.crust.length; i++) {
            const it = this.crust[i];
            const e = Math.min(1, Math.max(0, (t - it.delay) / 3.0));
            const sy = it.y - it.amp * Math.sin(Math.PI * e);
            ctx.fillStyle = `rgb(${it.r | 0},${it.g | 0},${it.b | 0})`;
            ctx.beginPath();
            ctx.arc(it.x, sy, it.rad, 0, 6.283);
            ctx.fill();
          }
        }
      }

      // Başlatma & Döngü
      const canvas = document.getElementById("cv");
      const ctx = canvas.getContext("2d");
      const stageBadge = document.getElementById("stage-badge");

      let size = 680;
      function resize() {
        const minSide = Math.min(window.innerWidth * 0.95, window.innerHeight * 0.95);
        size = Math.min(760, Math.max(380, Math.floor(minSide)));
        canvas.width = size;
        canvas.height = size;
      }
      resize();

      const plant = new Plant(size, size);
      let clock = 0;
      let lastTime = performance.now();

      function updateStageBadge(t) {
        if (t < 5) stageBadge.textContent = "Filizlenme & Köklenme";
        else if (t < 15) stageBadge.textContent = "Gövde Gelişimi";
        else if (t < 23) stageBadge.textContent = "Tomurcuk & Çiçeklenme";
        else if (t < 33) stageBadge.textContent = "Tam Açılma & İhtişam";
        else stageBadge.textContent = "Solma & Yaşlanma";
      }

      function loop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        clock += dt * TIME_SCALE;
        if (clock > T_END + 4.0) {
          clock = 0.0;
        }

        plant.render(ctx, clock);
        updateStageBadge(clock);
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", () => {
        resize();
        plant.W = size;
        plant.H = size;
        plant.cx = size / 2;
        plant.y0 = size * 0.80;
        plant.Ls = size * 0.38;
        plant.Lf = size * 0.235;
      });

      requestAnimationFrame(loop);
    })();
  </script>
</body>
